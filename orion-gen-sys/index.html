<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05060a"><meta name="apple-mobile-web-app-capable" content="yes"><title>ORION GEN-SYS</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{--bg:#05060a;--panel:#11131f;--accent:#00d1ff;--pink:#ff79c6;--text:#a9b4c6;--green:#50fa7b;--red:#ff5555;--border:#2d314d;--dark:#0a0b14}*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#10152b 0,#05060a 55%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,select,input{font:inherit;touch-action:manipulation}.app{width:min(1420px,100%);margin:auto;padding:14px}.panel{background:rgba(17,19,31,.94);border:1px solid var(--border);box-shadow:0 0 35px #00d1ff15;border-radius:10px;padding:12px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}.brand{color:var(--accent);font-weight:900;letter-spacing:.08em;text-shadow:0 0 10px #00d1ff55}.small{font-size:11px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:9px;min-width:0}label{display:block;color:var(--pink);font-size:10px;font-weight:800;margin:0 0 6px}select,input[type=range]{width:100%}select{min-height:38px;background:#05060a;color:var(--green);border:1px solid #343951;border-radius:6px;padding:7px}input[type=range]{accent-color:var(--accent);height:24px}.value{color:var(--green)}.transport{width:100%;min-height:48px;border:0;border-radius:8px;background:linear-gradient(#69ff91,#2e9148);color:#031007;font-weight:900;letter-spacing:.06em;box-shadow:0 4px 0 #1a4d28;margin:12px 0;cursor:pointer}.transport.on{background:linear-gradient(#ff6c6c,#912e2e);color:#160202;box-shadow:0 4px 0 #4d1a1a}.grid2{display:grid;grid-template-columns:1fr 1.1fr;gap:12px}.mixer{display:grid;gap:7px}.part{display:grid;grid-template-columns:14px 72px 1fr 58px;gap:7px;align-items:center;background:#151827;border:1px solid #30354d;border-radius:7px;padding:8px;cursor:pointer}.part.on{border-color:var(--green);background:#20243a}.led{width:9px;height:9px;border-radius:50%;background:#3a3d47}.part.on .led{background:var(--green);box-shadow:0 0 10px var(--green)}.mini{border:1px solid #444;background:#111;color:#fff;border-radius:5px;min-height:32px;font-size:10px}.seq{overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.tab{border:1px solid #343951;background:#141625;color:var(--text);border-radius:6px;padding:8px 10px;min-height:36px;font-size:10px}.tab.active{background:var(--pink);color:#000}.palette{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;max-height:106px;overflow:auto}.pal{border:1px solid #343951;background:#111420;color:var(--text);border-radius:5px;padding:7px;font-size:10px}.pal.active{background:var(--accent);color:#000}.steps{display:grid;grid-template-columns:repeat(16,minmax(30px,1fr));gap:4px;min-width:610px}.step{aspect-ratio:1;border:1px solid #30354d;background:#0d0f17;color:#62697b;border-radius:5px;font-size:9px}.step.on{background:var(--accent);color:#000;box-shadow:0 0 8px #00d1ff77}.step.play{outline:2px solid var(--green)}.status{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;background:#020305;border:1px inset #343951;border-radius:8px;padding:10px;margin-top:12px;color:var(--accent);font-size:11px}.drawer{position:fixed;inset:0;background:#000b;z-index:20;display:none;place-items:center;padding:12px}.drawer.open{display:grid}.card{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#06070c;border:1px solid var(--accent);border-radius:10px;padding:14px;box-shadow:0 20px 80px #000}.card h3{margin-top:0;color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.iconbtn{border:1px solid #3a405a;background:#0b0d15;color:var(--text);border-radius:7px;padding:8px;min-height:38px}.danger{color:var(--red);border-color:var(--red)}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:8px}.panel{padding:9px;border-radius:0}.head{align-items:flex-start}.brand{font-size:13px;line-height:1.35}.controls{grid-template-columns:1fr}.part{grid-template-columns:14px 58px 1fr 52px}.status{font-size:10px}.row{grid-template-columns:1fr}.steps{min-width:560px}}
</style></head><body><main class="app"><section class="panel"><div class="head"><div><div class="brand">ORION GEN-SYS // MK LXI</div><div class="small">MOBILE GENERATIVE SYNTH / MASTER CONTROL</div></div><button class="iconbtn" id="settingsBtn">⚙ MATRIX</button></div><button class="transport" id="playBtn">INITIATE SEQUENCE</button><div class="controls"><div class="box"><label>STYLE MACRO</label><select id="genre"></select><label>SUB-GENRE</label><select id="sub"></select></div><div class="box"><label>TUNING</label><select id="tuning"></select><label>ROOT</label><select id="root"></select></div><div class="box"><label>SCALE / MODE</label><select id="scale"></select><label>PLAYBACK</label><select id="mode"><option value="generative">Generative Brain</option><option value="sequencer">Sequencer</option></select></div><div class="box"><label>TEMPO <span class="value" id="tempoV">120</span></label><input id="tempo" type="range" min="40" max="220" value="120"><label>GEN BIAS <span class="value" id="densityV">50</span>%</label><input id="density" type="range" min="0" max="100" value="50"></div></div><div class="grid2" style="margin-top:12px"><div class="box"><label>PART MIXER / PRESENCE</label><div id="mixer" class="mixer"></div></div><div class="box seq"><label>128-STEP PERFORMANCE SEQUENCER</label><div id="tabs" class="tabs"></div><div id="palette" class="palette"></div><div id="steps" class="steps"></div></div></div><div class="status"><span>STEP <b id="beat" class="value">0</b>/127</span><span>MODE <b id="modeText" class="value">GEN</b></span><span>AUTO-SAVE <b class="value">ARMED</b></span><span>OFFLINE PWA <b class="value">READY</b></span></div></section></main><div class="drawer" id="drawer"><div class="card"><div class="head"><h3>STOCHASTIC MATRIX</h3><button class="iconbtn" id="closeBtn">CLOSE</button></div><div class="row"><div class="box"><label>MUTATION <span class="value" id="mutationV">10</span>%</label><input id="mutation" type="range" min="0" max="100" value="10"></div><div class="box"><label>PITCH VAR <span class="value" id="pitchV">50</span>%</label><input id="pitch" type="range" min="0" max="100" value="50"></div></div><div class="row" style="margin-top:10px"><div class="box"><label>PHILOSOPHY</label><select id="philosophy"><option>East Coast</option><option>West Coast</option><option>Berlin School</option><option>French Spectralism</option><option>Japanese Precision</option><option>Sheffield Industrial</option><option>Entropy Chaos</option></select></div><div class="box"><label>ATMOSPHERE</label><select id="vibe"><option>Neutral</option><option>Cinematic</option><option>Noir</option><option>Industrial</option><option>Synthwave</option><option>Cyberpunk</option><option>Dream-Pop</option><option>Lo-Fi</option><option>Avant-Garde</option></select></div></div><button class="iconbtn danger" id="randomBtn" style="width:100%;margin-top:12px">Ω RANDOMISE SYSTEM</button></div></div><script>
const $=id=>document.getElementById(id),parts=['drums','lead','bass','brass','strings','pluck','chords','drone','vox'],notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scales={Western:{Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10],Dorian:[0,2,3,5,7,9,10],Phrygian:[0,1,3,5,7,8,10],Lydian:[0,2,4,6,7,9,11],Pentatonic:[0,2,4,7,9],Blues:[0,3,5,6,7,10]},Arab:{Rast:[0,2,4,5,7,9,10],Bayati:[0,1.5,3,5,7,8,10],Hijaz:[0,1,4,5,7,8,10],Saba:[0,1.5,3,4,6,8,10]},Ottoman:{Rast:[0,2,4,5,7,9,10],Ussak:[0,1.5,3,5,7,8.5,10],Huseyni:[0,1.5,3,5,7,8.5,10]},Persian:{Shur:[0,1.5,3,5,7,8,10],Homayun:[0,1,4,5,7,8,11],Mahur:[0,2,4,5,7,9,11]},Hindustani:{Bhairav:[0,1,4,5,7,8,11],Yaman:[0,2,4,6,7,9,11],Kafi:[0,2,3,5,7,9,10]},Japanese:{Hirajoshi:[0,2,3,7,8],In:[0,1,5,7,8],Iwato:[0,1,5,6,10]}};
const genres={Techno:['Berlin','Dub','Acid','Hard'],House:['Deep','Chicago','Acid','French'],Ambient:['Drone','Cinematic','Nature','Space'],Synthwave:['Outrun','Neon','Cyber'],Industrial:['Sheffield','EBM','Noise'],Jazz:['Modal','Fusion','Noir'],Classical:['Minimalist','Spectral','Neo-Classical'],Pop:['Art-Pop','Electro','Dream'],Funk:['Classic','Electro','P-Funk'],Reggae:['Dub','Roots','Digital']};
let S={tempo:120,density:50,tuning:'Western',root:'C',scale:'Major',genre:'Techno',sub:'Berlin',mode:'generative',track:'lead',mutation:.1,pitch:.5,active:Object.fromEntries(parts.map(x=>[x,true])),presence:Object.fromEntries(parts.map(x=>[x,1])),seq:Object.fromEntries(parts.map(x=>[x,Array(128).fill(null)]))};let ctx=null,timer=null,beat=0,playing=false,wake=null;
function opt(el,arr,val){el.innerHTML='';arr.forEach(x=>el.add(new Option(x,x)));if(val&&arr.includes(val))el.value=val}function save(){localStorage.setItem('orion-mobile-v2',JSON.stringify(S))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('orion-mobile-v2'))||{})}catch{}}function hz(note,oct=4){let i=notes.indexOf(note);return 440*Math.pow(2,((oct-4)*12+i-9)/12)}function scaleNotes(){let a=scales[S.tuning][S.scale]||[0,2,4,5,7,9,11],r=notes.indexOf(S.root);return a.map(v=>({label:notes[(r+Math.round(v))%12]+(4+Math.floor((r+v)/12)),f:hz(S.root)*Math.pow(2,v/12)}))}
function init(){load();opt($('genre'),Object.keys(genres),S.genre);opt($('sub'),genres[S.genre],S.sub);opt($('tuning'),Object.keys(scales),S.tuning);opt($('root'),notes,S.root);opt($('scale'),Object.keys(scales[S.tuning]),S.scale);$('tempo').value=S.tempo;$('density').value=S.density;$('mode').value=S.mode;$('mutation').value=S.mutation*100;$('pitch').value=S.pitch*100;drawMixer();drawTabs();drawPalette();drawSteps();syncText()}
function syncText(){$('tempoV').textContent=S.tempo;$('densityV').textContent=S.density;$('mutationV').textContent=Math.round(S.mutation*100);$('pitchV').textContent=Math.round(S.pitch*100);$('modeText').textContent=S.mode==='generative'?'GEN':'SEQ'}
function drawMixer(){$('mixer').innerHTML='';parts.forEach(p=>{let d=document.createElement('div');d.className='part '+(S.active[p]?'on':'');d.innerHTML=`<i class="led"></i><b>${p.toUpperCase()}</b><input type="range" min="0" max="2" step=".1" value="${S.presence[p]??1}" aria-label="${p} presence"><button class="mini">${S.active[p]?'ON':'OFF'}</button>`;d.querySelector('input').oninput=e=>{S.presence[p]=+e.target.value;save()};d.querySelector('button').onclick=e=>{e.stopPropagation();S.active[p]=!S.active[p];drawMixer();save()};d.onclick=e=>{if(e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){S.active[p]=!S.active[p];drawMixer();save()}};$('mixer').append(d)})}
function drawTabs(){$('tabs').innerHTML='';parts.forEach(p=>{let b=document.createElement('button');b.className='tab '+(S.track===p?'active':'');b.textContent=p.toUpperCase();b.onclick=()=>{S.track=p;drawTabs();drawPalette();drawSteps();save()};$('tabs').append(b)})}
function drawPalette(){$('palette').innerHTML='';let vals=S.track==='drums'?['KICK','SNARE','HAT','CLAP','TOM','NOISE']:scaleNotes().map(x=>x.label);vals.forEach(v=>{let b=document.createElement('button');b.className='pal';b.textContent=v;b.onclick=()=>{document.querySelectorAll('.pal').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('palette').dataset.pick=v};$('palette').append(b)});$('palette').dataset.pick=vals[0]||'';$('palette').firstChild?.classList.add('active')}
function drawSteps(){$('steps').innerHTML='';for(let i=0;i<128;i++){let b=document.createElement('button');b.id='s'+i;b.className='step '+(S.seq[S.track][i]?'on':'');b.textContent=(i%16)+1;b.onclick=()=>{S.seq[S.track][i]=S.seq[S.track][i]?null:$('palette').dataset.pick;drawSteps();save()};$('steps').append(b)}}
function tone(f,d=.12,v=.12,type='sawtooth',t=ctx.currentTime){let o=ctx.createOscillator(),g=ctx.createGain(),fil=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);fil.type='lowpass';fil.frequency.value=2200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fil).connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.02)}function noise(d=.08,v=.14,t=ctx.currentTime){let b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;let n=ctx.createBufferSource(),g=ctx.createGain();n.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(g).connect(ctx.destination);n.start(t)}function drum(v,t){if(v==='KICK'){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.3)}else if(v==='SNARE'||v==='CLAP'||v==='NOISE')noise(v==='CLAP'?.05:.12,v==='SNARE'?.2:.12,t);else tone(v==='TOM'?180:7000,.07,.08,v==='HAT'?'square':'triangle',t)}
function playPart(p,val,t){if(!val||!S.active[p]||Math.random()>Math.min(1,S.presence[p]))return;if(p==='drums')return drum(val,t);let sn=scaleNotes(),m=val.match(/^([A-G]#?)(\d)$/),f=m?hz(m[1],+m[2]):sn[Math.floor(Math.random()*sn.length)].f;if(p==='bass')f/=2;if(p==='pluck')f*=2;if(p==='drone')f/=4;if(p==='chords'){[0,4,7].forEach(x=>tone(f*Math.pow(2,x/12),.5,.05,'sine',t));return}let type={lead:'square',bass:'triangle',brass:'sawtooth',strings:'sawtooth',pluck:'sine',drone:'sine',vox:'sawtooth'}[p]||'sine';tone(f,p==='drone'?.8:p==='strings'?.45:.15,p==='bass'?.16:.09,type,t)}
function tick(){if(!playing||!ctx)return;let t=ctx.currentTime,i=beat%128;document.querySelectorAll('.step.play').forEach(x=>x.classList.remove('play'));$('s'+i)?.classList.add('play');$('beat').textContent=i;parts.forEach(p=>{let val=S.seq[p][i];if(val)playPart(p,val,t);else if(S.mode==='generative'&&S.active[p]){let chance=(S.density/100)*(.15*S.presence[p]);if(p==='drums'){if(i%4===0&&Math.random()<.75)drum('KICK',t);if(i%8===4&&Math.random()<.65)drum('SNARE',t);if(i%2===0&&Math.random()<.7)drum('HAT',t)}else if(Math.random()<chance){let sn=scaleNotes(),pick=sn[Math.floor(Math.random()*sn.length)].label;playPart(p,pick,t)}}});beat++}
async function start(){if(playing){playing=false;clearInterval(timer);$('playBtn').classList.remove('on');$('playBtn').textContent='INITIATE SEQUENCE';if(wake)try{await wake.release()}catch{};wake=null;if(ctx)await ctx.close();ctx=null;return}ctx=new(AudioContext||webkitAudioContext)();await ctx.resume();playing=true;$('playBtn').classList.add('on');$('playBtn').textContent='TERMINATE SEQUENCE';timer=setInterval(tick,(60/S.tempo/4)*1000);try{wake=await navigator.wakeLock?.request('screen')}catch{}}
$('playBtn').onclick=start;$('settingsBtn').onclick=()=>$('drawer').classList.add('open');$('closeBtn').onclick=()=>$('drawer').classList.remove('open');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')};$('genre').onchange=e=>{S.genre=e.target.value;S.sub=genres[S.genre][0];opt($('sub'),genres[S.genre],S.sub);save()};$('sub').onchange=e=>{S.sub=e.target.value;save()};$('tuning').onchange=e=>{S.tuning=e.target.value;S.scale=Object.keys(scales[S.tuning])[0];opt($('scale'),Object.keys(scales[S.tuning]),S.scale);drawPalette();save()};$('root').onchange=e=>{S.root=e.target.value;drawPalette();save()};$('scale').onchange=e=>{S.scale=e.target.value;drawPalette();save()};$('mode').onchange=e=>{S.mode=e.target.value;syncText();save()};$('tempo').oninput=e=>{S.tempo=+e.target.value;syncText();if(playing){clearInterval(timer);timer=setInterval(tick,(60/S.tempo/4)*1000)}save()};$('density').oninput=e=>{S.density=+e.target.value;syncText();save()};$('mutation').oninput=e=>{S.mutation=e.target.value/100;syncText();save()};$('pitch').oninput=e=>{S.pitch=e.target.value/100;syncText();save()};$('randomBtn').onclick=()=>{S.tempo=70+Math.floor(Math.random()*100);S.density=25+Math.floor(Math.random()*70);parts.forEach(p=>{S.presence[p]=+(Math.random()*1.6+.3).toFixed(1)});for(let p of parts)for(let i=0;i<128;i++)if(Math.random()<S.mutation)S.seq[p][i]=null;$('tempo').value=S.tempo;$('density').value=S.density;drawMixer();drawSteps();syncText();save()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing)ctx?.resume()});window.addEventListener('pagehide',save);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script></body></html>
