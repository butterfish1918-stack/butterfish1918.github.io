<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Generative RetroSynth | Orion GEN-SYS MK LXI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="workspace">
        <div class="header-strip">
            <h1>ORION GEN-SYS // MK LXI // MASTER CONTROL</h1>
            <div class="header-controls">
                <label>TUNING</label>
                <select id="tuningSelect" class="global-mode-select"></select>
                <label>PHILOSOPHY</label>
                <select id="globalModeSelect" class="global-mode-select">
                    <option value="east">East Coast</option>
                    <option value="west">West Coast</option>
                    <option value="berlin">Berlin School</option>
                    <option value="french">French Spectralism</option>
                    <option value="japanese">Japanese Precision</option>
                    <option value="sheffield">Sheffield Industrial</option>
                    <option value="chaos">Entropy Chaos</option>
                </select>
                <button class="wheel-btn" style="background:none; border:none; cursor:pointer; color:var(--text); font-size:14px;" onclick="toggleSettingsOverlay()">⚙</button>
                <button class="rand-btn" style="background:none; border:none; cursor:pointer; color:var(--text); font-size:14px;" onclick="randomiseAll()">Ω</button>
            </div>
        </div>

        <div id="settingsOverlay" style="display:none; position:absolute; top:80px; right:40px; z-index:5000; width:320px; background:#000; border:2px solid var(--accent); padding:20px; box-shadow:15px 15px 0px rgba(0,0,0,0.9);">
            <h3 style="color:var(--accent); font-size:7px; margin-bottom:15px; border-bottom:1px solid var(--accent); padding-bottom:8px;">STOCHASTIC MATRIX</h3>
            <div style="display:grid; gap:15px; max-height: 400px; overflow-y: auto;">
                <div style="display:flex; justify-content:space-between;"><label>PITCH VAR</label><input type="range" id="randPitchVar" min="0" max="1" step="0.01" value="0.5"></div>
                <div style="display:flex; justify-content:space-between;"><label>MUTATION</label><input type="range" id="mutationRate" min="0" max="1" step="0.01" value="0.1"></div>
                <div style="display:flex; justify-content:space-between;"><label>LIFESPAN</label><div style="display:flex; align-items:center; gap:5px;"><input type="range" id="evolveInterval" min="4" max="128" step="4" value="16"><span id="evolveDisp" style="color:var(--led); font-size:5px;">16</span></div></div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>AFFECTIVE STATE / MOOD</label>
                    <select id="moodSelect">
                        <option value="neutral">NEUTRAL (NO BIAS)</option>
                        <option value="joy">JOY: PURE / HIGH VALENCE</option>
                        <option value="sadness">SADNESS: REFLECTIVE / LOSS</option>
                        <option value="anxiety">ANXIETY: HIGH AROUSAL / TENSION</option>
                        <option value="calmness">CALMNESS: SERENE / LOW ENERGY</option>
                        <option value="anger">ANGER: AGGRESSIVE / SHEFFIELD</option>
                        <option value="awe">AWE: VAST / DIMINISHING</option>
                        <option value="boredom">BOREDOM: DETACHED / FLAT</option>
                        <option value="nostalgia">NOSTALGIA: BITTERSWEET / YEARNING</option>
                        <option value="excitement">EXCITEMENT: ANTICIPATION / PRE-DROP</option>
                        <option value="melancholy">MELANCHOLY: AESTHETICIZED SADNESS</option>
                        <option value="amusement">AMUSEMENT: LIGHTHEARTED / WIT</option>
                        <option value="defiance">DEFIANCE: RESISTANT / POWERFUL</option>
                        <option value="dreaminess">DREAMINESS: ETHEREAL / DETACHED</option>
                        <option value="triumph">TRIUMPH: VICTORY / PEAK</option>
                        <option value="loneliness">LONELINESS: ISOLATION / PERVASIVE</option>
                        <option value="romance">ROMANCE: INTIMACY / DESIRE</option>
                        <option value="confusion">CONFUSION: DISSONANT / CHAOTIC</option>
                        <option value="fear">FEAR: THREAT / SURVIVAL</option>
                        <option value="contentment">CONTENTMENT: PEACEFUL / PRESENT</option>
                        <option value="frustration">FRUSTRATION: BLOCKED / STUCK</option>
                        <option value="disgust">DISGUST: AVERSION / UGLY</option>
                        <option value="hope">HOPE: POSITIVE / FUTURE</option>
                        <option value="guilt">GUILT: HEAVY / SELF-REPROACH</option>
                        <option value="aesthetic">AESTHETIC APPRECIATION: BEAUTY</option>
                        <option value="aggression">AGGRESSION: RAW / PROACTIVE</option>
                    </select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>ATMOSPHERE / VIBE</label>
                    <select id="vibeSelect">
                        <option value="neutral">NEUTRAL (NO BIAS)</option>
                        <option value="cinematic">CINEMATIC: GRAND / WIDESCREEN</option>
                        <option value="gaming">VIDEO GAME: CHIPTUNE / 8-BIT</option>
                        <option value="trailer">TRAILER: HIGH IMPACT / EPIC</option>
                        <option value="noir">NOIR: DARK / SMOKY</option>
                        <option value="documentary">DOCUMENTARY: MINIMALIST / FACTUAL</option>
                        <option value="horror">HORROR: DISSONANT / TENSION</option>
                        <option value="club">CLUB: PEAK TIME / HIGH ENERGY</option>
                        <option value="lounge">LOUNGE: SOPHISTICATED / BACKGROUND</option>
                        <option value="festival">FESTIVAL: ANTHEMIC / HANDS-UP</option>
                        <option value="afterhours">AFTER-HOURS: DEEP / HYPNOTIC</option>
                        <option value="underground">UNDERGROUND: RAW / ANTI-COMMERCIAL</option>
                        <option value="poolside">POOLSIDE: SUNNY / TROPICAL</option>
                        <option value="lofi">LO-FI: MUFFLED / NOSTALGIC</option>
                        <option value="synthwave">SYNTHWAVE: RETRO-FUTURE / NEON</option>
                        <option value="darkacademia">DARK ACADEMIA: BROODING / CLASSICAL</option>
                        <option value="cottagecore">COTTAGECORE: PASTORAL / FOLK</option>
                        <option value="cyberpunk">CYBERPUNK: DYSTOPIAN / METALLIC</option>
                        <option value="ethereal">DREAM-POP: REVERB / FLOATING</option>
                        <option value="workout">WORKOUT: HIGH-OCTANE / EXERTION</option>
                        <option value="corporate">CORPORATE: CLEAN / TECH</option>
                        <option value="nature">NATURE: ORGANIC / WOODY</option>
                        <option value="meditative">MEDITATIVE: ATMOSPHERIC / SLOW</option>
                        <option value="elevator">ELEVATOR: BLAND / SMOOTHING</option>
                        <option value="industrial">INDUSTRIAL: COLD / SHEFFIELD</option>
                        <option value="avantgarde">AVANT-GARDE: UNPREDICTABLE / CHALLENGING</option>
                    </select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>RANDOMNESS SOURCE</label>
                    <select id="randomnessSelect">
                        <option value="uniform">UNIFORM RANDOMNESS (DEFAULT)</option>
                        <option value="quantum">QUANTUM (IRREDUCIBLE)</option>
                        <option value="thermal">THERMAL NOISE (JOHNSON-NYQUIST)</option>
                        <option value="atmospheric">ATMOSPHERIC NOISE (RADIO)</option>
                        <option value="brownian">BROWNIAN MOTION (RANDOM WALK)</option>
                        <option value="shot">SHOT NOISE (DISCRETE)</option>
                        <option value="jitter">CLOCK JITTER (TIMING VAR)</option>
                        <option value="pseudorandom">PSEUDORANDOMNESS (PRNG)</option>
                        <option value="csprng">CRYPTOGRAPHIC (CSPRNG)</option>
                        <option value="kolmogorov">KOLMOGOROV (INCOMPRESSIBLE)</option>
                        <option value="lxm">LXM (HYBRID GENERATOR)</option>
                        <option value="mersenne">MERSENNE TWISTER (PERIODIC)</option>
                        <option value="chaotic">CHAOTIC (DETERMINISTIC)</option>
                        <option value="gaussian">GAUSSIAN (BELL CURVE)</option>
                        <option value="poisson">POISSON (INTERVAL EVENTS)</option>
                        <option value="exponential">EXPONENTIAL (DECAY)</option>
                        <option value="pareto">PARETO (80/20 RULE)</option>
                        <option value="levy">LEVY FLIGHTS (HEAVY TAIL)</option>
                        <option value="lognormal">LOG-NORMAL (MULTIPLICATIVE)</option>
                        <option value="randomwalk">RANDOM WALK (PATH)</option>
                        <option value="martingale">MARTINGALE (FAIR BET)</option>
                        <option value="markovian">MARKOVIAN (MEMORYLESS)</option>
                        <option value="bernoulli">BERNOULLI PROCESS (BINARY)</option>
                        <option value="epistemic">EPISTEMIC (INCOMPLETE INFO)</option>
                        <option value="hardware">HARDWARE ENTROPY (PHYSICAL)</option>
                    </select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>SONG STRUCTURE</label>
                    <select id="structureSelect">
                        <option value="free">FREE GENERATION (DEFAULT)</option>
                        <option value="strophic">STROPHIC (AAA)</option>
                        <option value="verse_chorus">VERSE-CHORUS (ABAB)</option>
                        <option value="aaba">AABA (AMERICAN POP)</option>
                        <option value="through">THROUGH-COMPOSED</option>
                        <option value="ternary">TERNARY (ABA)</option>
                        <option value="binary">BINARY (AB)</option>
                        <option value="build_drop">BUILD-DROP-BREAKDOWN</option>
                        <option value="extended">EXTENDED/DJ-FRIENDLY</option>
                        <option value="minimalist">MINIMALIST/ROLLING</option>
                        <option value="progressive">PROGRESSIVE</option>
                    </select>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>TIME PERIOD</label>
                    <select id="decadeSelect">
                        <option value="2020s">2020s (MODERN)</option>
                        <option value="2010s">2010s (STREAMING)</option>
                        <option value="2000s">2000s (LOUDNESS WAR)</option>
                        <option value="1990s">1990s (DIGITAL CLARITY)</option>
                        <option value="1980s">1980s (BRIGHT/GATED)</option>
                        <option value="1970s">1970s (HI-FI ANALOG)</option>
                        <option value="1960s">1960s (WALL OF SOUND)</option>
                        <option value="1950s">1950s (MAGNETIC TAPE)</option>
                        <option value="1940s">1940s (WAR ERA SATURATION)</option>
                        <option value="1930s">1930s (EARLY ELECTRIC)</option>
                        <option value="1920s">1920s (MECHANICAL)</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><label>EVOLVE</label><input type="checkbox" id="autoEvolveToggle"></div>
                <button class="flip-btn" style="width:100%; padding:10px; background:#000; border:1px solid var(--danger); color:var(--danger); font-family:'Press Start 2P'; font-size:6px; cursor:pointer;" onclick="toggleSettingsOverlay()">CLOSE</button>
            </div>
        </div>

        <div class="transport">
            <button id="toggleBtn">INITIATE SEQUENCE</button>
        </div>
        <div class="utility-bar" aria-label="Project and export tools">
            <button class="utility-btn primary" id="saveProjectBtn">💾 SAVE PROJECT</button>
            <button class="utility-btn" id="loadProjectBtn">↥ LOAD PROJECT</button>
            <button class="utility-btn midi" id="exportMidiBtn">⇩ EXPORT MIDI</button>
            <button class="utility-btn" id="randomiseBtnMobile">Ω RANDOMISE</button>
            <input id="projectFileInput" type="file" accept="application/json,.json,.orion">
        </div>

        <div class="main-layout">
            <div class="controls-grid">
                <div class="control-block">
                    <label>STYLE MACRO</label><select id="genreSelect"></select>
                    <label>SUB-GENRE</label><select id="subGenreSelect"></select>
                </div>
                <div class="control-block">
                    <label>MASTER SOUND</label><select id="masterSoundSelect">
                        <option value="neutral">Neutral Flat</option>
                        <option value="edm">EDM Mixing/Master</option>
                        <option value="lofi">Lo-Fi Radio</option>
                        <option value="sheffield">Sheffield Steel</option>
                        <option value="cinematic">Cinematic Wide</option>
                        <option value="vinyl">1970s Vinyl</option>
                    </select>
                </div>
                <div class="control-block">
                    <label id="rootLabel">ROOT/KARAR</label><select id="rootSelect"></select>
                    <label id="scaleLabel">SCALE/MAQAM</label><select id="scaleSelect"></select>
                </div>
                <div class="control-block">
                    <label>TEMPO: <span id="tempoDisp" class="val-disp">120</span></label><input type="range" id="tempoSlider" min="40" max="220" value="120">
                    <label>GEN BIAS: <span id="moodDisp" class="val-disp">50</span>%</label><input type="range" id="moodSlider" min="0" max="100" value="50">
                </div>
                <div class="control-block">
                    <label>PLAYBACK MODE</label><select id="playbackMode"><option value="sequencer">Sequencer</option><option value="generative" selected>Generative Brain</option></select>
                    <label>TEMPERAMENT</label><select id="tempSelect" class="global-mode-select"></select>
                </div>
                <div class="control-block" id="drumMatrixControls" style="display:none;">
                    <label>RHYTHM TYPE</label><select id="rhythmStyleSelect"></select>
                    <label>SYNC STATUS</label><div style="font-size:5px; color:var(--led)">SEQUENCER INTEGRATED</div>
                </div>
            </div>

            <!-- Integrated Mixer/Performance Flippable Card -->
            <div class="mixer-container">
                <div class="mixer-card" id="globalMixerCard">
                    <div class="mixer-front" id="mixerFront"></div>
                    <div class="mixer-back" id="mixerBack">
                        <div class="perf-header">
                            <span id="perfInstrumentTitle" style="color:var(--led); font-size:7px;">CALIBRATION</span>
                            <button class="row-action-btn" onclick="flipMixerCard()">↲ FLIP BACK</button>
                        </div>
                        <div id="singingExtraControls" style="display:none; margin-bottom:10px; border:1px solid #333; padding:5px; border-radius:2px;">
                            <label style="font-size:4px;">VOCAL ENGINE</label>
                            <div style="display:flex; gap:10px; margin-top:4px;">
                                <select id="singingModeSelect" style="flex:1;">
                                    <option value="choir">ENSEMBLE CHOIR</option>
                                    <option value="voice">FORMANT VOICE</option>
                                </select>
                                <select id="vocalPhonemeSelect" style="flex:1;">
                                    <option value="ah">AH (WORD 1)</option>
                                    <option value="oh">OH (WORD 2)</option>
                                    <option value="ee">EE (WORD 3)</option>
                                </select>
                            </div>
                        </div>
                        <div class="perf-grid-area" id="perfGridArea"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sequencer-container" id="seqContainer">
            <div id="trackTabs" style="display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap;">
                <div class="track-tab drums" id="tab-drums" onclick="setEditTrack('drums')">DRUMS</div>
                <div class="track-tab active" id="tab-lead" onclick="setEditTrack('lead')">LEAD</div>
                <div class="track-tab" id="tab-bass" onclick="setEditTrack('bass')">BASS</div>
                <div class="track-tab" id="tab-brass" onclick="setEditTrack('brass')">BRASS</div>
                <div class="track-tab" id="tab-strings" onclick="setEditTrack('strings')">STRINGS</div>
                <div class="track-tab" id="tab-pluck" onclick="setEditTrack('pluck')">PLUCK</div>
                <div class="track-tab" id="tab-chords" onclick="setEditTrack('chords')">CHRDS</div>
                <div class="track-tab" id="tab-drone" onclick="setEditTrack('drone')">DRONE</div>
                <div class="track-tab" id="tab-singing" onclick="setEditTrack('singing')">VOX</div>
            </div>
            <div id="inputPalette"></div>
            <div id="sequencerGridArea"></div>
        </div>

        <div class="status-display">
            <div>STEP: <span id="beatDisp" class="val-disp">0</span></div>
            <div>SIG: <span id="sigDisp" class="val-disp">4/4</span></div>
            <div style="color:var(--led)">MK LXI // MASTER BUS ARMED</div>
        </div>
    </div>

    <script src="js/part1.js"></script>
<script src="js/part2.js"></script>
<script src="js/part3.js"></script>
<script src="js/part4.js"></script>
<script src="js/part5.js"></script>
<script src="js/part6.js"></script>
<script src="js/part7.js"></script>
<script src="js/part8.js"></script>
<script src="js/part9.js"></script>
<script>document.addEventListener('click', e => { if (e.target.closest('.step-btn,.palette-btn,.row-master-toggle,.track-tab,.part-row,.row-action-btn,.utility-btn')) scheduleSave(); }, {passive:true});</script>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
