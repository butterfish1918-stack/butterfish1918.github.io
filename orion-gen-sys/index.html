<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070911">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles-1.css?v=4">
    <link rel="stylesheet" href="styles-2.css?v=4">
    <link rel="stylesheet" href="styles-3.css?v=4">
    <title>ORION GEN-SYS MK LXI</title>
</head>
<body>
<div id="app-root"></div>
<script>
(async()=>{
  const root=document.getElementById('app-root');
  try {
    const fragments=await Promise.all(['app-1.html?v=4', 'app-2.html?v=4', 'app-3.html?v=4'].map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text();})));
    root.outerHTML=fragments.join('');
    const scripts=[1,2,3,4,5,6,7,8,9].map(n=>'js/part'+n+'.js?v=4');
    for(const src of scripts) await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});
    document.addEventListener('click',e=>{if(e.target.closest('.step-btn,.palette-btn,.row-master-toggle,.track-tab,.part-row,.row-action-btn,.utility-btn')) scheduleSave();},{passive:true});
    if(typeof window.onload==='function') window.onload();
  } catch(err) {
    console.error(err);
    document.body.innerHTML='<main style="padding:24px;color:#fff;font-family:monospace">ORION failed to initialise. Reload the page once while online.</main>';
  }
})();
</script>
</body>
</html>
