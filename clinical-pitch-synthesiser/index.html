<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Clinical Pitch Synthesiser — pitch, intonation and vocal telemetry laboratory." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Clinical Pitch Synthesiser</title>
  <style>
    html{background:#050505;color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
    html,body,#root{min-height:100%;margin:0}body{min-width:320px;background:#050505;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{font:inherit}button,select,input[type=range]{touch-action:manipulation}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#050505;color:#d4af37;font-family:monospace;z-index:9999;letter-spacing:.08em}
    @media(max-width:767px){button{min-height:44px}input,select,textarea{font-size:16px!important}}
    @media(display-mode:standalone){body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}}
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script crossorigin src="https://unpkg.com/lucide-react@0.469.0/dist/umd/lucide-react.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="boot">INITIALISING ACOUSTIC LABORATORY…</div>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.textContent = 'STARTUP ERROR — RELOAD WITH A NETWORK CONNECTION';
    });
  </script>
  <script>
    (async () => {
      try {
        const partNames = ['./app-1.part','./app-2.part','./app-3.part','./app-4.part','./app-5.part'];
        const sources = await Promise.all(partNames.map(async name => {
          const response = await fetch(name);
          if (!response.ok) throw new Error(`Failed to load ${name}`);
          return response.text();
        }));
        const compiled = Babel.transform(sources.join(''), { presets: ['env', 'react'], sourceType: 'script' }).code;
        (0, eval)(compiled);
        const boot = document.getElementById('boot');
        if (boot) boot.remove();
      } catch (error) {
        console.error(error);
        const boot = document.getElementById('boot');
        if (boot) boot.textContent = 'STARTUP ERROR — ' + error.message;
      }
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
