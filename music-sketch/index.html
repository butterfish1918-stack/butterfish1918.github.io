<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d11"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>Music Sketch 0.8</title></head><body style="margin:0;background:#0b0d11;color:#e8ecf4;font:16px system-ui"><div id="boot" style="padding:24px">Loading Music Sketch 0.8…</div><script>(async()=>{try{const p=await Promise.all([1,2,3].map(i=>fetch(`./payload/v08-shell${i}.txt`).then(r=>{if(!r.ok)throw Error(`shell ${i}: ${r.status}`);return r.text()})));const b=Uint8Array.from(atob(p.join('').replace(/\s/g,'')),c=>c.charCodeAt(0));const st=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const h=new TextDecoder().decode(await new Response(st).arrayBuffer());document.open();document.write(h);document.close()}catch(e){console.error(e);document.getElementById('boot').textContent='Music Sketch could not start. Refresh once or clear the old site cache.'}})();</script></body></html>
