<body>
<div id="message-box"></div>
<header>
<h1>Mvsicvm Analyticvm</h1>
<p class="subtitle">Polyphonic MIR &amp; Fretboard Divination</p>
</header>
<div class="container">
<div class="panel">
<h2>Scriptorvm (ABC Input)</h2>
<textarea id="abc-input" spellcheck="false">

Q:1/4=120
M:4/4
L:1/16
K:C clef=bass
%%staves {1 2 3 4 9}
% --- MIXING &amp; INSTRUMENTS ---
V:1 name="Fuzz Guitar" clef=bass
V:2 name="Leslie Guitar" clef=bass
V:3 name="Heavy Bass" clef=bass
V:4 name="Synth Pad" clef=treble
V:9 name="Drums" clef=perc
%
V:1
z16 | z16 | z16 | z16 | z16 |
V:2
!mp! &lt;(! [E,,G,,B,,E,G,]16 | [E,,G,,B,,E,G,]16 | [E,,G,,B,,E,G,]16 | [E,,G,,B,,E,G,]16 !)! | z16 |
V:3
E,,16 | E,,16 | E,,16 | E,,16 | E,,2E,,2 E,,2E,,2 E,,2z2 z4 |
V:4
!p! &lt;(! [E16B16e16g16] | [E16B16e16g16] | [E16B16e16g16] | [E16B16e16g16] !)! | z16 |
V:9
C,,4 ^F,,4 C,,4 ^F,,4 | C,,4 ^F,,4 C,,4 ^F,,4 | C,,2C,,2 ^F,,4 C,,2C,,2 ^F,,4 | C,,2C,,2 ^F,,2^F,,2 C,,2C,,2 ^F,,2^F,,2 | D,,2D,,2 F,,2F,,2 A,,2A,,2 ^C,4 |
            </textarea>
<div class="controls">
<button id="render-main-btn" onclick="initialiseRendering()">Analyse &amp; Render Score</button>
<button id="toggle-btn" onclick="toggleNotation()" style="display:none;">View Tablature Only</button>
<button id="pdf-btn" onclick="exportToPDF()" style="display:none;">Liberate as PDF</button>
</div>
<div class="app-note">Android-ready PWA · your draft is saved locally on this device.</div>
</div>
<div class="vellum-wrapper" id="output-wrapper">
<div class="analysis-box" id="analysis-output"></div>
<h4 style="font-family:var(--font-display); color:var(--accent-blood); font-size: 2.2rem; text-align: center; margin-bottom: 15px;">Harmonic Lexicon (Voicings)</h4>
<div id="chord-overview"></div>
<div id="sheet-music"></div>
</div>
</div>

<script defer="" src="./engine.js"></script><script defer="" src="./app.js"></script></body>
