<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Heliocentric" />
  <meta name="description" content="Heliocentric — a 16-track generative FM rhythm engine." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./heliocentric-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=7" />
  <title>Heliocentric</title>
</head>
<body>
  <div id="root"></div>

  <script>
    // Build 7 deliberately removes the old Heliocentric service worker/cache.
    // That cache contained broken early source chunks on some Android devices.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => {
          if (reg.scope.includes('/heliocentric/')) reg.unregister().catch(() => {});
        });
      }).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then((keys) => Promise.all(
        keys.filter((key) => key.startsWith('heliocentric-')).map((key) => caches.delete(key))
      )).catch(() => {});
    }
  </script>

  <script src="../vendor/react.development.js?v=7"></script>
  <script src="../vendor/react-dom.development.js?v=7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.17/Tone.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./loader.js?v=7"></script>
</body>
</html>
