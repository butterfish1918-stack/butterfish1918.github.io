name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh branch
        run: git pull --rebase origin main
      - name: Apply Archive v13 patch
        run: python3 .github/archive-v13-patch.py
      - name: Validate Archive v13
        run: |
          node --check the-archive/app.js
          node --check the-archive/v13.js
          grep -q "const V='13.0.0'" the-archive/v13.js
          grep -q './v13.js' the-archive/index.html
          grep -q './v13.css' the-archive/index.html
          grep -q "archive-v13.0.0" the-archive/sw.js
          grep -q "'relationships'" the-archive/storage.js
          git diff --check
      - name: Restore normal Pages workflow and commit v13
        run: |
          rm -f .github/archive-v13-patch.py .github/workflows/archive-v13.yml
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/pages.yml').write_text('''name: Deploy GitHub Pages

