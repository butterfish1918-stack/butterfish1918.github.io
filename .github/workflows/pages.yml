name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Archive v13 when needed
        run: |
          git pull --rebase origin main
          if ! grep -q './v13.js' the-archive/index.html; then
            python3 .github/archive-v13-patch.py
            node --check the-archive/app.js
            node --check the-archive/v13.js
            grep -q "const V='13.0.0'" the-archive/v13.js
            grep -q './v13.js' the-archive/index.html
            grep -q './v13.css' the-archive/index.html
            grep -q "archive-v13.0.0" the-archive/sw.js
            grep -q "'relationships'" the-archive/storage.js
            rm -f .github/archive-v13-patch.py .github/workflows/archive-v13.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add the-archive .github
            git diff --cached --check
            git commit -m 'Deploy The Archive Wardrobe Intelligence v13'
            git push origin HEAD:main
          else
            echo 'Archive v13 already linked; deployment only.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
