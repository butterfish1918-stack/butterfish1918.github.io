name: Upgrade The Archive to v13

on:
  push:
    paths:
      - '.github/workflows/archive-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh branch
        run: git pull --rebase origin main
      - name: Apply v13 patch
        run: python3 .github/archive-v13-patch.py
      - name: Validate JavaScript
        run: |
          node --check the-archive/app.js
          node --check the-archive/v13.js
          grep -q "const V='13.0.0'" the-archive/v13.js
          grep -q './v13.js' the-archive/index.html
          grep -q './v13.css' the-archive/index.html
          grep -q "archive-v13.0.0" the-archive/sw.js
          grep -q "'relationships'" the-archive/storage.js
      - name: Validate HTML
        run: python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          P().feed(Path('the-archive/index.html').read_text())
          print('HTML parse OK')
          PY
      - name: Commit production upgrade
        run: |
          rm -f .github/archive-v13-patch.py .github/workflows/archive-v13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-archive .github
          git diff --cached --check
          git commit -m 'Deploy The Archive Wardrobe Intelligence v13'
          git push origin HEAD:main

