name: Assemble Archive v10

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/assemble-archive-v10.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble production files
        run: |
          cat .github/archive-v10/index.part* | tr -d '\n' | base64 -d > the-archive/index.html
          cat .github/archive-v10/app.part* | tr -d '\n' | base64 -d > the-archive/app.js
          node --check the-archive/app.js
          test -s the-archive/index.html
          grep -q "Wardrobe Operating System v10.0" the-archive/index.html

      - name: Commit v10 build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-archive/index.html the-archive/app.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Deploy Archive Wardrobe OS v10"
          git push
