<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050302"><title>The Alchemist's Automaton</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/alchemist-mark.svg" type="image/svg+xml"><style>html,body{margin:0;min-height:100%;background:#050302;color:#d6cfc1;font-family:Georgia,serif}body{display:grid;place-items:center;min-height:100svh;background:radial-gradient(circle at 50% 40%,#2a1111,#050302 66%)}.boot{text-align:center;padding:2rem}.seal{width:54px;height:54px;margin:0 auto 1rem;border:1px solid #a98a4b;border-radius:50%;box-shadow:0 0 30px #75202055,inset 0 0 18px #000;animation:p 1.8s ease-in-out infinite}.k{font:11px monospace;letter-spacing:.18em;text-transform:uppercase;color:#a98a4b}.t{font-size:1.5rem;margin:.45rem 0 .35rem}.s{font:11px monospace;color:#91897d}@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 40px #75202088,inset 0 0 18px #000}}</style></head><body><div class="boot"><div class="seal"></div><div class="k">Experimental Vocal Laboratory</div><div class="t">Inducing respiration…</div><div class="s" id="s">Preparing the instrument</div></div><script>(async()=>{const status=document.getElementById('s');async function inflate(url){const r=await fetch(url);if(!r.ok)throw new Error(url+' '+r.status);if(!('DecompressionStream'in self))throw new Error('This browser needs DecompressionStream support');const ds=new DecompressionStream('gzip');return await new Response(r.body.pipeThrough(ds)).text()}try{const[a,b]=await Promise.all([inflate('./bundle-a.gz'),inflate('./bundle-b.gz')]);document.open();document.write(a+b);document.close()}catch(e){console.error(e);status.textContent='Unable to open the instrument: '+e.message}})();</script></body></html>
